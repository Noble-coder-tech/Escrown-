<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- This tag below tells mobile browsers to scale the page to 100% device width -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escrown | Reset Password</title>
    <!-- The ?v=1.1 trick forces the mobile browser to clear its cache and load your new styles -->
    <link rel="stylesheet" href="forget.css?v=1.1"> 
    <link rel="icon" type="image" href="logo.png">
</head>
<body>
    <div class="auth-container">
        <h2>Reset Your Password</h2>
        <p>Enter your email address and we'll send you a link to reset your password.</p>
        
        <form id="forgot-form">
            <input type="email" id="forgot-email" placeholder="Enter your email" required>
            <button type="submit" id="reset-btn">Send Reset Link</button>
        </form>

        <p><a href="signin.html">Back to Sign In</a></p>
    </div>
    <script type="module" src="auth.js"></script>
</body>
</html>
